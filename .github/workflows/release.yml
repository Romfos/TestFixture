on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nuget package version"
        required: true
        type: string
run-name: Release ${{ inputs.Version }}

jobs:
  release:
    permissions:
      id-token: write
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Pack nuget package
        run: dotnet pack ./src/TestFixture/TestFixture.csproj -p:Version=${{ inputs.Version }} -o "./build" -p:CI=true

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget
        run: dotnet nuget push .\build\*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
